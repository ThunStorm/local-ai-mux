name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  sdk-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install openai
      - run: cargo build -p localmux-gateway --features compat-harness --bin localmux-compat-server
      - name: Official SDK smoke
        env:
          LOCALMUX_TEST_API_KEY: lmx_test_ci
          LOCALMUX_TEST_PORT: '18317'
          LOCALMUX_TEST_BASE_URL: http://127.0.0.1:18317/v1
        run: bash scripts/sdk-smoke.sh
