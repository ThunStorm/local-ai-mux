name: Source prerelease
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and tag
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          node scripts/check-release.mjs
      - name: Publish and verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "LocalAiMux $GITHUB_REF_NAME" --notes-from-tag
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,tagName,url \
            | jq -e --arg tag "$GITHUB_REF_NAME" 'select(.tagName == $tag and .isPrerelease and (.isDraft | not))'
