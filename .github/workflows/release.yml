name: macOS prerelease
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and tag
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          node scripts/check-release.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --bundles app
      - name: Archive the Apple Silicon app
        run: |
          app=target/release/bundle/macos/LocalAiMux.app
          test "$(lipo -archs "$app/Contents/MacOS/localmux-desktop")" = arm64
          ditto -c -k --sequesterRsrc --keepParent "$app" LocalAiMux-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: LocalAiMux-macos-arm64.zip
          if-no-files-found: error

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
      - name: Publish and verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" LocalAiMux-macos-arm64.zip \
            --verify-tag --prerelease --title "LocalAiMux $GITHUB_REF_NAME" --notes-from-tag
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,tagName,url,assets \
            | jq -e --arg tag "$GITHUB_REF_NAME" 'select(.tagName == $tag and .isPrerelease and (.isDraft | not) and any(.assets[]; .name == "LocalAiMux-macos-arm64.zip"))'
