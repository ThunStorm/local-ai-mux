name: Desktop build
on:
  workflow_dispatch:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: localmux-${{ matrix.os }}-unsigned
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
