name: Signed update candidate
on:
  workflow_dispatch:
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      LOCALMUX_UPDATER_PUBLIC_KEY: ${{ vars.LOCALMUX_UPDATER_PUBLIC_KEY }}
      LOCALMUX_UPDATER_ENDPOINT: ${{ vars.LOCALMUX_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require release signing configuration
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$LOCALMUX_UPDATER_PUBLIC_KEY"
          case "$LOCALMUX_UPDATER_ENDPOINT" in https://*) ;; *) exit 1 ;; esac
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --bundles ${{ matrix.bundle }} --config apps/desktop/src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: localmux-${{ matrix.os }}-update-candidate
          path: |
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
