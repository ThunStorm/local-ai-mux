[package]
name = "localmux-telemetry"
version.workspace = true
edition = "2021"

[dependencies]
regex = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flate2 = "1"
localmux-core = { path = "../core" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tracing = "0.1"
