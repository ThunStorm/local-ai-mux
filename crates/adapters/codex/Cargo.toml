[package]
name = "localmux-adapter-codex"
version.workspace = true
edition = "2021"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
localmux-adapter-sdk = { path = "../../adapter-sdk" }
localmux-domain = { path = "../../domain" }
localmux-quota = { path = "../../quota" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "rt", "macros"] }
