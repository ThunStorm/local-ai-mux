[package]
name = "localmux-adapter-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
futures-util = "0.3"
localmux-domain = { path = "../domain" }
localmux-quota = { path = "../quota" }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
